      TEST_EMAIL_2:    ${{ secrets.TEST_EMAIL_2 }}
      TEST_PASSWORD_2: ${{ secrets.TEST_PASSWORD_2 }}

    steps:
      - uses: actions/checkout@v4
        with:
          repository: CivicDataLab/CivicDataSpace-test
          # Check out the code under test, which is not always `CI`.
          #
          # `repository:` has to be pinned because this workflow is called from
          # other repos (DataSpaceBackend, DataSpaceFrontend); without it a
          # checkout there would fetch the caller's code, not this suite.
          #
          # But pinning `ref: CI` too meant a pull request's checks ran against
          # `CI` rather than against the pull request. That went wrong three
