# CivicDataSpace-test/.github/workflows/run-smoke.yml
name: Smoke Tests

on:
  push:
    branches: [CI]
  pull_request:
    branches: [CI]
  workflow_dispatch: {}
  workflow_call:
    inputs:
      api_base_url:
        description: 'Backend base URL for api-smoke (maps to API_BASE_URL). Leave unset to skip API tests.'
        type: string
        required: false
        default: ''
      deployed_sha:
        description: 'Commit SHA to verify against the live /health/ git_sha field. Leave unset to skip the check.'
        type: string
        required: false
        default: ''
      min_passed:
        description: 'Minimum number of api-smoke tests that must pass for the job to succeed.'
        type: number
        required: false
        default: 1
    secrets:
      HOME_URL_DEV:
        required: true
      TEST_EMAIL_1:
        required: true
      TEST_PASSWORD_1:
        required: true
      TEST_EMAIL_2:
        required: false
      TEST_PASSWORD_2:
        required: false

jobs:
  consumer-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      HOME_URL_DEV: ${{ secrets.HOME_URL_DEV }}

    steps:
      - uses: actions/checkout@v4
        with:
          repository: CivicDataLab/CivicDataSpace-test
          ref: CI

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          install-chromedriver: true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Sanity check
        run: |
          echo "HOME_URL_DEV set? $([ -n "$HOME_URL_DEV" ] && echo yes || echo no)"
          google-chrome --version || true
          chromedriver --version || true

      - name: Set markers
        id: markers
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" || "${{ github.event_name }}" == "workflow_call" ]]; then
            echo "value=smoke or functional" >> $GITHUB_OUTPUT
          else
            echo "value=smoke" >> $GITHUB_OUTPUT
          fi

      - name: Run consumer smoke tests
        run: |
          pytest tests/consumer/smoke -m "${{ steps.markers.outputs.value }}" -v --json-report

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: consumer-screenshots
          path: screenshots/
          if-no-files-found: ignore

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: consumer-report
          path: |
            report.json
            TEST_REPORT.md
            TEST_REPORT.pdf
          if-no-files-found: ignore

      - name: Summary
        if: always()
        shell: bash
        run: |
          echo "### Consumer Smoke Summary" >> "$GITHUB_STEP_SUMMARY"
          if [ -f report.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          s = json.load(open("report.json")).get("summary", {})
          for k in ("total", "passed", "failed", "skipped", "error"):
              if k in s:
                  print(f"- **{k}**: {s[k]}")
          PY
          else
            echo "- report.json not found" >> "$GITHUB_STEP_SUMMARY"
          fi

  api-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      HOME_URL_DEV: ${{ secrets.HOME_URL_DEV }}
      TEST_EMAIL_1: ${{ secrets.TEST_EMAIL_1 }}
      TEST_PASSWORD_1: ${{ secrets.TEST_PASSWORD_1 }}
      API_BASE_URL: ${{ inputs.api_base_url }}
      EXPECTED_DEPLOYED_SHA: ${{ inputs.deployed_sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          repository: CivicDataLab/CivicDataSpace-test
          ref: CI

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Sanity check
        run: |
          echo "HOME_URL_DEV set? $([ -n "$HOME_URL_DEV" ] && echo yes || echo no)"
          echo "TEST_EMAIL_1 set? $([ -n "$TEST_EMAIL_1" ] && echo yes || echo no)"
          echo "API_BASE_URL set? $([ -n "$API_BASE_URL" ] && echo yes || echo no)"

      - name: Set markers
        id: markers
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" || "${{ github.event_name }}" == "workflow_call" ]]; then
            echo "value=smoke or functional" >> $GITHUB_OUTPUT
          else
            echo "value=smoke" >> $GITHUB_OUTPUT
          fi

      - name: Run API smoke tests
        run: |
          pytest tests/api/smoke -m "${{ steps.markers.outputs.value }}" -v --json-report -n 2

      - name: Enforce minimum passed count
        run: |
          python - <<'PY'
          import json
          import sys

          min_passed = int("${{ inputs.min_passed }}" or "1")
          summary = json.load(open("report.json")).get("summary", {})
          passed = summary.get("passed", 0)

          print(f"passed={passed} min_passed={min_passed}")
          if passed < min_passed:
              print(
                  f"::error::Only {passed} test(s) passed, need at least {min_passed} "
                  "-- a fully-skipped run (e.g. API_BASE_URL not reaching the tests) "
                  "would otherwise exit 0 and look green."
              )
              sys.exit(1)
          PY

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-report
          path: |
            report.json
            TEST_REPORT.md
            TEST_REPORT.pdf
          if-no-files-found: ignore

      - name: Summary
        if: always()
        shell: bash
        run: |
          echo "### API Smoke Summary" >> "$GITHUB_STEP_SUMMARY"
          if [ -f report.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          s = json.load(open("report.json")).get("summary", {})
          for k in ("total", "passed", "failed", "skipped", "error"):
              if k in s:
                  print(f"- **{k}**: {s[k]}")
          PY
          else
            echo "- report.json not found" >> "$GITHUB_STEP_SUMMARY"
          fi

  provider-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      HOME_URL_DEV:    ${{ secrets.HOME_URL_DEV }}
      TEST_EMAIL_1:    ${{ secrets.TEST_EMAIL_1 }}
      TEST_PASSWORD_1: ${{ secrets.TEST_PASSWORD_1 }}
      TEST_EMAIL_2:    ${{ secrets.TEST_EMAIL_2 }}
      TEST_PASSWORD_2: ${{ secrets.TEST_PASSWORD_2 }}

    steps:
      - uses: actions/checkout@v4
        with:
          repository: CivicDataLab/CivicDataSpace-test
          ref: CI

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          install-chromedriver: true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Sanity check
        run: |
          echo "HOME_URL_DEV set? $([ -n "$HOME_URL_DEV" ] && echo yes || echo no)"
          echo "TEST_EMAIL_1 set? $([ -n "$TEST_EMAIL_1" ] && echo yes || echo no)"
          google-chrome --version || true
          chromedriver --version || true

      - name: Set markers
        id: markers
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" || "${{ github.event_name }}" == "workflow_call" ]]; then
            echo "value=smoke or functional" >> $GITHUB_OUTPUT
          else
            echo "value=smoke" >> $GITHUB_OUTPUT
          fi

      - name: Run provider smoke tests
        run: |
          pytest tests/provider/smoke -m "${{ steps.markers.outputs.value }}" -v --json-report -n 2

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider-screenshots
          path: screenshots/
          if-no-files-found: ignore

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider-report
          path: |
            report.json
            TEST_REPORT.md
            TEST_REPORT.pdf
          if-no-files-found: ignore

      - name: Summary
        if: always()
        shell: bash
        run: |
          echo "### Provider Smoke Summary" >> "$GITHUB_STEP_SUMMARY"
          if [ -f report.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          s = json.load(open("report.json")).get("summary", {})
          for k in ("total", "passed", "failed", "skipped", "error"):
              if k in s:
                  print(f"- **{k}**: {s[k]}")
          PY
          else
            echo "- report.json not found" >> "$GITHUB_STEP_SUMMARY"
          fi
