# CivicDataSpace-test/.github/workflows/run-smoke.yml
name: Consumer Smoke Tests

on:
  push:
    branches: [CI]
  pull_request:
    branches: [CI]
  workflow_dispatch: {}
  workflow_call:
    secrets:
      HOME_URL_DEV:
        required: true

jobs:
  consumer-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      HOME_URL_DEV: ${{ secrets.HOME_URL_DEV }}

    steps:
      - uses: actions/checkout@v4
        with:
          repository: CivicDataLab/CivicDataSpace-test
          ref: CI

      - name: Debug working directory
        run: ls -la

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          install-chromedriver: true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Sanity check
        run: |
          echo "HOME_URL_DEV set? $([ -n "$HOME_URL_DEV" ] && echo yes || echo no)"
          google-chrome --version || true
          chromedriver --version || true

      - name: Run consumer smoke tests
        run: |
          pytest tests/consumer/smoke -m smoke -v --json-report

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: ignore

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: |
            report.json
            TEST_REPORT.md
            TEST_REPORT.pdf
          if-no-files-found: ignore

      - name: Summary
        if: always()
        shell: bash
        run: |
          echo "### Consumer Smoke Summary" >> "$GITHUB_STEP_SUMMARY"
          if [ -f report.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          s = json.load(open("report.json")).get("summary", {})
          for k in ("total", "passed", "failed", "skipped", "error"):
              if k in s:
                  print(f"- **{k}**: {s[k]}")
          PY
          else
            echo "- report.json not found" >> "$GITHUB_STEP_SUMMARY"
          fi
