# CivicDataSpace-test/.github/workflows/run-smoke.yml
name: Smoke Tests

on:
  push:
    branches: [CI]
  pull_request:
    branches: [CI]
  workflow_dispatch: {}
  workflow_call:
    inputs:
      api_base_url:
        description: 'Backend base URL for api-smoke (maps to API_BASE_URL). Leave unset to skip API tests.'
        type: string
        required: false
        default: ''
      deployed_sha:
        description: 'Commit SHA to verify against the live /health/ git_sha field. Leave unset to skip the check.'
        type: string
        required: false
        default: ''
      min_passed:
        description: 'Minimum number of api-smoke tests that must pass for the job to succeed.'
        type: number
        required: false
        default: 1
    secrets:
      HOME_URL_DEV:
        required: true
      TEST_EMAIL_1:
        required: true
      TEST_PASSWORD_1:
        required: true
      TEST_EMAIL_2:
        required: false
      TEST_PASSWORD_2:
        required: false
      # Required in practice by api-smoke, declared optional so the existing
      # callers (DataSpaceBackend, DataSpaceFrontend) keep parsing until they
      # pass it. api-smoke preflights it and fails with a readable message
      # rather than a 401 from inside a fixture.
      KEYCLOAK_CLIENT_SECRET:
        required: false

jobs:
  consumer-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      HOME_URL_DEV: ${{ secrets.HOME_URL_DEV }}

    steps:
      - uses: actions/checkout@v4
        with:
          repository: CivicDataLab/CivicDataSpace-test
          # Check out the code under test, which is not always `CI`.
          #
          # `repository:` has to be pinned because this workflow is called from
          # other repos (DataSpaceBackend, DataSpaceFrontend); without it a
          # checkout there would fetch the caller's code, not this suite.
          #
          # But pinning `ref: CI` too meant a pull request's checks ran against
          # `CI` rather than against the pull request. That went wrong three
          # separate ways in one day:
          #
          #   - #24 added tests that never executed on their own PR. They were
          #     green, merged, and then broke consumer-smoke on the next deploy
          #     in a different repo - which rolled the backend back.
          #   - #20's checks reported on `CI`, not on the merge being proposed.
          #   - #26, the fix for that breakage, could not go green: its checks
          #     ran the broken code it was deleting, so it was unmergeable
          #     without an override.
          #
          # When this workflow runs in its own repository, check out whatever
          # triggered it - the PR head for a pull_request, the pushed commit
          # otherwise. When it is called from another repository,
          # `github.repository` is the caller, and `CI` remains correct.
          ref: >-
            ${{ github.repository == 'CivicDataLab/CivicDataSpace-test'
                && (github.event.pull_request.head.sha || github.sha)
                || 'CI' }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          install-chromedriver: true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Sanity check
        run: |
          echo "HOME_URL_DEV set? $([ -n "$HOME_URL_DEV" ] && echo yes || echo no)"
          google-chrome --version || true
          chromedriver --version || true

      - name: Set markers
        id: markers
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" || "${{ github.event_name }}" == "workflow_call" ]]; then
            echo "value=smoke or functional" >> $GITHUB_OUTPUT
          else
            echo "value=smoke" >> $GITHUB_OUTPUT
          fi

      - name: Run consumer smoke tests
        run: |
          pytest tests/consumer/smoke -m "${{ steps.markers.outputs.value }}" -v --json-report

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: consumer-screenshots
          path: screenshots/
          if-no-files-found: ignore

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: consumer-report
          path: |
            report.json
            TEST_REPORT.md
            TEST_REPORT.pdf
          if-no-files-found: ignore

      - name: Summary
        if: always()
        shell: bash
        run: |
          echo "### Consumer Smoke Summary" >> "$GITHUB_STEP_SUMMARY"
          if [ -f report.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          s = json.load(open("report.json")).get("summary", {})
          for k in ("total", "passed", "failed", "skipped", "error"):
              if k in s:
                  print(f"- **{k}**: {s[k]}")
          PY
          else
            echo "- report.json not found" >> "$GITHUB_STEP_SUMMARY"
          fi

  api-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      HOME_URL_DEV: ${{ secrets.HOME_URL_DEV }}
      TEST_EMAIL_1: ${{ secrets.TEST_EMAIL_1 }}
      TEST_PASSWORD_1: ${{ secrets.TEST_PASSWORD_1 }}
      # Falls back to the dev backend so push/PR runs actually exercise the
      # API tests. Without a default, `inputs` is empty on a push event, every
      # api-smoke test skipped, and the job reported success having asserted
      # nothing - the same hollow green the Keycloak preflight above exists to
      # prevent. A caller's api_base_url still wins.
      API_BASE_URL: ${{ inputs.api_base_url || vars.API_BASE_URL || 'https://dev.api.civicdataspace.in' }}
      EXPECTED_DEPLOYED_SHA: ${{ inputs.deployed_sha }}

      # Without these the keycloak_config fixture skips, and every
      # authenticated API test skips with it -- a green run that asserted
      # nothing. Host, realm and client id are public, so they are repo
      # variables with literal defaults: visible in review, overridable
      # without a code change, and correct out of the box.
      KEYCLOAK_URL: ${{ vars.KEYCLOAK_URL || 'https://auth.civicdatalab.in' }}
      KEYCLOAK_REALM: ${{ vars.KEYCLOAK_REALM || 'DataSpace' }}
      KEYCLOAK_CLIENT_ID: ${{ vars.KEYCLOAK_CLIENT_ID || 'dataspace' }}
      # `dataspace` is a confidential client: ROPC returns 401
      # unauthorized_client without this, so it is a real secret.
      KEYCLOAK_CLIENT_SECRET: ${{ secrets.KEYCLOAK_CLIENT_SECRET }}
      # What KEYCLOAK_URL must actually resolve to. Pinned independently and
      # NOT derived from KEYCLOAK_URL: the decommissioned server is internally
      # consistent (it reports its own /auth issuer quite happily), so
      # comparing an issuer against the host it came from passes for any
      # running Keycloak and proves nothing about which one it is.
      EXPECTED_ISSUER: ${{ vars.EXPECTED_ISSUER || 'https://auth.civicdatalab.in/realms/DataSpace' }}

    steps:
      - uses: actions/checkout@v4
        with:
          repository: CivicDataLab/CivicDataSpace-test
          # Check out the code under test, which is not always `CI`.
          #
          # `repository:` has to be pinned because this workflow is called from
          # other repos (DataSpaceBackend, DataSpaceFrontend); without it a
          # checkout there would fetch the caller's code, not this suite.
          #
          # But pinning `ref: CI` too meant a pull request's checks ran against
          # `CI` rather than against the pull request. That went wrong three
          # separate ways in one day:
          #
          #   - #24 added tests that never executed on their own PR. They were
          #     green, merged, and then broke consumer-smoke on the next deploy
          #     in a different repo - which rolled the backend back.
          #   - #20's checks reported on `CI`, not on the merge being proposed.
          #   - #26, the fix for that breakage, could not go green: its checks
          #     ran the broken code it was deleting, so it was unmergeable
          #     without an override.
          #
          # When this workflow runs in its own repository, check out whatever
          # triggered it - the PR head for a pull_request, the pushed commit
          # otherwise. When it is called from another repository,
          # `github.repository` is the caller, and `CI` remains correct.
          ref: >-
            ${{ github.repository == 'CivicDataLab/CivicDataSpace-test'
                && (github.event.pull_request.head.sha || github.sha)
                || 'CI' }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Fails the job instead of letting the run go green on skips. The whole
      # point of this suite is the authenticated paths; if the Keycloak config
      # is absent they skip, the summary still reads 0 failed, and nobody
      # notices. That is how a stale KEYCLOAK_URL survived the migration.
      - name: Preflight Keycloak configuration
        run: |
          echo "HOME_URL_DEV set? $([ -n "$HOME_URL_DEV" ] && echo yes || echo no)"
          echo "TEST_EMAIL_1 set? $([ -n "$TEST_EMAIL_1" ] && echo yes || echo no)"
          echo "API_BASE_URL set? $([ -n "$API_BASE_URL" ] && echo yes || echo no)"

          missing=0
          for v in KEYCLOAK_URL KEYCLOAK_REALM KEYCLOAK_CLIENT_ID KEYCLOAK_CLIENT_SECRET; do
            if [ -z "${!v}" ]; then echo "::error::$v is not set"; missing=1; else echo "$v set"; fi
          done
          if [ "$missing" = "1" ]; then
            echo "::error::Authenticated API tests would silently skip. Add the missing values as repository secrets/variables on CivicDataSpace-test, and pass KEYCLOAK_CLIENT_SECRET from any workflow that calls this one."
            exit 1
          fi

          # Prove the configured host is the migrated one before running anything.
          issuer=$(curl -sf --max-time 15 "$KEYCLOAK_URL/realms/$KEYCLOAK_REALM/.well-known/openid-configuration" | python -c 'import json,sys; print(json.load(sys.stdin)["issuer"])' 2>/dev/null) || {
            echo "::error::No OIDC discovery document at $KEYCLOAK_URL/realms/$KEYCLOAK_REALM -- KEYCLOAK_URL is wrong or the server is down."
            exit 1
          }
          echo "issuer:   $issuer"
          echo "expected: $EXPECTED_ISSUER"
          if [ "$issuer" != "$EXPECTED_ISSUER" ]; then
            echo "::error::KEYCLOAK_URL resolves to issuer '$issuer', but this deployment requires '$EXPECTED_ISSUER'. Tokens from the wrong issuer are rejected by the backend, so every authenticated test would fail or silently skip."
            exit 1
          fi

      - name: Set markers
        id: markers
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" || "${{ github.event_name }}" == "workflow_call" ]]; then
            echo "value=smoke or functional" >> $GITHUB_OUTPUT
          else
            echo "value=smoke" >> $GITHUB_OUTPUT
          fi

      - name: Run API smoke tests
        run: |
          pytest tests/api/smoke -m "${{ steps.markers.outputs.value }}" -v --json-report -n 2

      - name: Enforce minimum passed count
        # Now that API_BASE_URL always has a value, this runs on every event,
        # including direct push and PR. That is the point: a fully-skipped
        # api-smoke can no longer exit 0 and look green.
        #
        # The unauthenticated health tests satisfy min_passed on their own, so
        # this stays green when the token-exchange endpoint is timing out and
        # the authenticated tests skip - an endpoint outage should not be
        # reported as a test failure. A genuine 401 still fails.
        if: ${{ env.API_BASE_URL != '' }}
        run: |
          python - <<'PY'
          import json
          import sys

          min_passed = int("${{ inputs.min_passed }}" or "1")
          summary = json.load(open("report.json")).get("summary", {})
          passed = summary.get("passed", 0)

          print(f"passed={passed} min_passed={min_passed}")
          if passed < min_passed:
              print(
                  f"::error::Only {passed} test(s) passed, need at least {min_passed} "
                  "-- a fully-skipped run (e.g. API_BASE_URL not reaching the tests) "
                  "would otherwise exit 0 and look green."
              )
              sys.exit(1)
          PY

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-report
          path: |
            report.json
            TEST_REPORT.md
            TEST_REPORT.pdf
          if-no-files-found: ignore

      - name: Summary
        if: always()
        shell: bash
        run: |
          echo "### API Smoke Summary" >> "$GITHUB_STEP_SUMMARY"
          if [ -f report.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          s = json.load(open("report.json")).get("summary", {})
          for k in ("total", "passed", "failed", "skipped", "error"):
              if k in s:
                  print(f"- **{k}**: {s[k]}")
          PY
          else
            echo "- report.json not found" >> "$GITHUB_STEP_SUMMARY"
          fi

  provider-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      HOME_URL_DEV:    ${{ secrets.HOME_URL_DEV }}
      TEST_EMAIL_1:    ${{ secrets.TEST_EMAIL_1 }}
