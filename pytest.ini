# pytest.ini
[pytest]
minversion = 6.0
# --dist loadfile keeps every test in a file on one worker, so the numbered
# provider flows stay in order and share a browser account. No effect unless
# -n/--numprocesses is passed.
#
# --reruns/--only-rerun: retry a test up to twice, but ONLY when it failed on a
# timing signature (Selenium's TimeoutException, pytest-timeout's own
# "Failed: Timeout" wrapper, or a StaleElementReferenceException from a React
# re-render between find and use) — the kind of failure this suite has repeatedly
# turned out to be a race or a throttled backend rather than a real bug.
# AssertionError is deliberately excluded: those are logic/data failures (e.g.
# a hardcoded fixture that no longer exists) and rerunning them would only mask
# them as flakiness instead of surfacing them.
addopts = --json-report --json-report-file=report.json --dist loadfile
    --reruns 2 --reruns-delay 5
    --only-rerun "TimeoutException"
    --only-rerun "Failed: Timeout"
    --only-rerun "StaleElementReferenceException"
testpaths = tests

markers =
    smoke:      quick “does the page load?” smoke tests
    functional: end-to-end business flow tests
    regression: guard specific behaviors against breakage (error handling, auth enforcement, API contracts, known bugs)
    mobile:     viewport/mobile-specific tests
    api:        REST and GraphQL API tests (no browser required)
    seo:        sitemap/robots.txt/analytics regression checks
    readonly:   verified to make no writes; the ONLY tests allowed to run against production. Opt-in per file, never by default.
    timeout: limit test duration (requires pytest-timeout)
